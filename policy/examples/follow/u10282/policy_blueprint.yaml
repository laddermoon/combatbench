# Self-contained MixedPolicy entry point.
#
# Wraps the primary (learning) policy with a standing fallback, guarded by a
# Gating MLP that predicts balance stability and switches control when needed.
#
# All paths use ${DIR} (resolved to this file's directory at load time), so
# the entire directory can be zipped and submitted without modification.
#
# Submission system loads this file (policy_blueprint.yaml) as the entry point.

version: 1
cls: "baseline.humanoid21.curriculum.mixed_policy:MixedPolicy"
config:
  # Primary policy: inline blueprint referencing the local policy.py.
  # ExportedMLPPolicy auto-discovers model.pt from its own directory.
  primary_policy_bp:
    version: 1
    cls: "file:${DIR}/policy.py:ExportedMLPPolicy"
    config:
      stochastic: false

  # Fallback policy: separate blueprint in the fallback/ subdirectory.
  fallback_policy_bp: "${DIR}/fallback/policy_blueprint.yaml"

  # Gating model directory (contains gating_config.json + gating_model.pt).
  gating_model_dir: "${DIR}/gating_model"

  # Switching thresholds.
  threshold: 0.5
  release_threshold: 0.8
  release_patience: 5
