version: 1
parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:MujocoCombatSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "envs.humanoid21.plugins:CombatScoringPlugin"
    config:
      initial_health: 100.0
      initial_health_a: 100.0
      initial_health_b: 100.0
      force_scale: 100.0
observer_plugins:
  combat_scoring:
    cls: "envs.humanoid21.observer_plugins:CombatScoringObserver"
    config: {}
