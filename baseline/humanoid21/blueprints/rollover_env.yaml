# Rollover ablation environment blueprint.
#
# Same fallen-state initialization as standup_4stage, but only RolloverRewarder
# (pure orientation signal). No termination plugin — episodes end by timeout.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 200
    description: "Max action steps."
  agent_id:
    default: "robot_a"

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ${agent_id}
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5

observer_plugins:
  standup:
    cls: "baseline.humanoid21.rewards.rollover:RolloverRewarder"
    config:
      agent_id: ${agent_id}
