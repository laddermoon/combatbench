# Standup v3 — single policy: stand up from fall + dynamic stepping balance.
# Combines:
#   - RandomFallenStatePlugin (fallen state init)
#   - ImbalanceTerminationPlugin (fall detection, gated by min_height)
#   - StandupPotentialRewarderV2 (PBRS for get-up phase)
#   - CrossSupportBalanceRewarder (alternating foot support = stepping)
#   - PostureRewarder (joint deviation, velocity, tilt, foot height)
#   - HeightObserver (height tracking)
#
# No StandupTerminationPlugin — success is surviving the full episode,
# not reaching a static standing pose.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps (30s @ 20Hz)."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."
  height_threshold:
    default: 0.3
    description: "RandomFallenStatePlugin height threshold."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ${agent_id}
      max_phy_steps: 1000
      height_threshold: ${height_threshold}
      reset_interval: 5
  - cls: "baseline.humanoid21.plugins.imbalance_termination:ImbalanceTerminationPlugin"
    config:
      agent_id: ${agent_id}
      force_threshold: 1.0
      tolerance: 3
      min_height: 0.45

observer_plugins:
  standup:
    cls: "baseline.humanoid21.rewards.standup_v2:StandupPotentialRewarderV2"
    config:
      agent_id: ${agent_id}
  cross_support:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: ${agent_id}
  posture:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: ${agent_id}
  height:
    cls: "baseline.humanoid21.plugins.height_observer:HeightObserver"
    config:
      agent_id: ${agent_id}
