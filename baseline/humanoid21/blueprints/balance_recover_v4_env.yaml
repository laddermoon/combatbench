# Balance recovery v4: online impulse perturbation during training.
#
# Each episode: ImpulsePerturbationPlugin runs an internal sim with a reference
# policy, applies a random impulse (force/duration/direction sampled from
# configured ranges), and the resulting perturbed state becomes the initial
# state. The training policy then attempts to recover.
#
# Unlike v3 (StateBankInitPlugin), this generates infinite diverse states.
# The state bank is only used externally to calibrate the force range.
#
# Used by exp_balance_recover_v4.py for iterative balance recovery training.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."
  tolerance:
    default: 6
    description: "Steps of consecutive imbalance before termination."
  policy_blueprint_path:
    default: null
    description: >-
      Path to policy_blueprint.yaml for the internal sim. The policy
      controls the robot during impulse application so that the perturbed
      state is physically realistic.
  impulse_body:
    default: "torso"
    description: "Body to apply impulse force on."
  force_magnitude:
    default: [10, 200]
    description: "Force magnitude range (N). [min, max]."
  duration_action_steps:
    default: [1, 8]
    description: "Impulse duration range (action steps). [min, max]."
  direction_mode:
    default: "random_horizontal"
    description: "Direction sampling mode."
  fixed_direction:
    default: null
    description: "Fixed direction vector [x, y, z] when direction_mode='fixed'."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:ImbalanceTerminationPlugin"
    config:
      agent_id: ${agent_id}
      tolerance: ${tolerance}

  - cls: "envs.humanoid21.disturbance_plugins:ImpulsePerturbationPlugin"
    config:
      target_robot: ${agent_id}
      policy_blueprint_path: ${policy_blueprint_path}
      impulse_body: ${impulse_body}
      force_magnitude: ${force_magnitude}
      duration_action_steps: ${duration_action_steps}
      direction_mode: ${direction_mode}
      fixed_direction: ${fixed_direction}
      phy_steps_per_action: 25

observer_plugins:
  cross_support:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: ${agent_id}
  posture:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: ${agent_id}
