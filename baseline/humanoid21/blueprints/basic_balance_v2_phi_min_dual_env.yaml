# Dual-agent balance environment with HeightPhiMinObserver per agent.
# Same as basic_balance_v2_phi_dual_env.yaml but uses HeightPhiMinObserver
# which computes φ_A = min(height/standing_height, uprightness) instead of
# the product form uprightness * (height / standing_height).

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:DualImbalanceTerminationPlugin"
    config:
      force_threshold: 1.0
      tolerance: 1
observer_plugins:
  cross_support_a:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_a"
  cross_support_b:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_b"
  posture_a:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: "robot_a"
  posture_b:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: "robot_b"
  height_phi_a:
    cls: "baseline.humanoid21.plugins.height_phi_min_observer:HeightPhiMinObserver"
    config:
      agent_id: "robot_a"
  height_phi_b:
    cls: "baseline.humanoid21.plugins.height_phi_min_observer:HeightPhiMinObserver"
    config:
      agent_id: "robot_b"
