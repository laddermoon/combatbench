# 4-stage standing-balance environment (dead-zone-free potential).
#
# RandomFallenStatePlugin initializes the robot in a random fallen state.
# StandingBalance4StageRewarder provides a continuous hierarchical potential:
# rollover → hand/foot proximity → midpoint distance → load transfer + stand up.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 200
    description: "Max action steps."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ${agent_id}
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5

observer_plugins:
  standing_balance:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: ${agent_id}
