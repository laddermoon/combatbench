# Standup v2 training — random fall initialization + early termination.
# Uses RandomFallenStatePlugin for fallen state, StandupTerminationPlugin
# for success/stagnation early stop, and StandupPotentialRewarder for
# potential-based reward shaping.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps (20s @ 20Hz)."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ${agent_id}
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.plugins.standup_termination:StandupTerminationPlugin"
    config:
      agent_id: ${agent_id}
      success_height: 0.60
      success_uprightness: 0.70
      success_hold_steps: 50
      stagnation_height: 0.25
      stagnation_steps: 150

observer_plugins:
  standup:
    cls: "baseline.humanoid21.rewards.standup_v2:StandupPotentialRewarderV2"
    config:
      agent_id: ${agent_id}
  height:
    cls: "baseline.humanoid21.plugins.height_observer:HeightObserver"
    config:
      agent_id: ${agent_id}
