# P0 Stage 2: Standing with random initial state perturbation.
# Same as Stage 1 but adds random initialization of tilt, angular velocity, and joint offsets.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:MujocoCombatSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:ImbalanceTerminationPlugin"
    config:
      agent_id: ${agent_id}

  # Random initial state perturbation (applied at episode start).
  # Reuses the existing disturbance plugin; note it uses target_robot.
  - cls: "envs.humanoid21.disturbance_plugins:InitialStatePerturbationPlugin"
    config:
      target_robot: ${agent_id}
      joint_pos_delta_max: 0.1
      joint_vel_delta_max: 0.1
      root_tilt_deg_max: 15.0
      root_angular_velocity_delta_max: 1.0
