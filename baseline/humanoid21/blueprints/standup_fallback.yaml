# ParameterizedPolicyBlueprint for StandupFallbackPolicy.
#
# Wraps any primary policy with a frozen standup fallback.
# When the robot falls (height < fall_height), the standup policy takes over.
# When the robot stands back up (height > stand_height), control returns to primary.
#
# Usage (code):
#   from envs.framework.policy import ParameterizedPolicyBlueprint
#   pb = ParameterizedPolicyBlueprint.load("baseline/humanoid21/blueprints/standup_fallback.yaml")
#   policy = pb.build(primary_policy_bp="path/to/any/policy.yaml")
#
# primary_policy_bp / standup_policy_bp accept either:
#   - A string path to a blueprint YAML file
#   - A PolicyBlueprint dict (version/cls/config)

version: 1
parameters:
  primary_policy_bp:
    default: "/data1/mono/things/combatbench/policy/blueprints/random.yaml"
    description: "Path (str) or dict for the primary policy blueprint."
  standup_policy_bp:
    default: "/data1/mono/things/combatbench/baseline/runs/train_standing_balance_4stage_dense_ppo_resume5k_20260730_211100/policy_exports/u04935/policy_blueprint.yaml"
    description: "Path (str) or dict for the frozen standup policy blueprint."
  fall_height:
    default: 0.5
    description: "Robot height below which standup policy takes over (m)."
  stand_height:
    default: 1.25
    description: "Robot height above which control returns to primary (m)."

cls: "baseline.humanoid21.curriculum.standup_fallback_policy:StandupFallbackPolicy"
config:
  primary_policy_bp: "${primary_policy_bp}"
  standup_policy_bp: "${standup_policy_bp}"
  fall_height: "${fall_height}"
  stand_height: "${stand_height}"
