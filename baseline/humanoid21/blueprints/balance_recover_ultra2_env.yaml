# P0 Stage 2: Standing with random initial state perturbation.
# Same as Stage 1 but adds random initialization of tilt, angular velocity, and joint offsets.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."
  # --- Initial-state perturbation magnitudes (scaled per curriculum level) ---
  init_steps:
    default: 1000
    description: "Init Steps, bigger init steps , harder to recover , 1000 , the robot is fallen down."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  # Random initial state perturbation (applied at episode start).
  # Reuses the existing disturbance plugin; note it uses target_robot.
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ${agent_id}
      max_phy_steps: ${init_steps}
      height_threshold: 0.3
      reset_interval: 5
observer_plugins:
  cross_support:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: ${agent_id}
  posture:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: ${agent_id}
  fall_contact:
    cls: "baseline.humanoid21.rewards.fall_contact_observer:FallContactObserver"
    config:
      agent_id: ${agent_id}