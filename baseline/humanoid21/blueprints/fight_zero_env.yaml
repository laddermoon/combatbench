# Fight-Zero environment: minimal observers for the new reward strategy.
#
# Key difference from fight_v2_env.yaml:
#   - damage: DamageBreakdownRewarder (separate dealt/taken) instead of NetDamageRewarder
#   - No posture observer (not used in fight_zero reward)
#   - No cross_support observer (not used in fight_zero reward)
#   - approach_velocity: kept (provides self/opp xy for PBRS distance computation)

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
  agent_id:
    default: "robot_a"
    description: "The robot we care about."
  oppo_agent_id:
    default: "robot_b"
    description: "The oppo robot, mustnt the same as agent_id."
  tolerance:
    default: 6
    description: "Steps of consecutive imbalance before termination."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:ImbalanceTerminationPlugin"
    config:
      agent_id: "both"
      tolerance: ${tolerance}
  - cls: "envs.humanoid21.plugins:CombatScoringPlugin"
    config:
      initial_health: 100.0
      initial_health_a: 100.0
      initial_health_b: 100.0
      force_scale: 100.0
      request_termination_on_ko: False
observer_plugins:
  approach_velocity:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: ${agent_id}
  damage:
    cls: "baseline.humanoid21.rewards.damage:DamageBreakdownRewarder"
    config:
      agent_id: ${agent_id}
