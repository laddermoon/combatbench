# V2 线 S4 分支 — 臂令跟随 + 步令跟随（D16/D17）：79 维。
#
# = v2_step_env.yaml 换 sim 为 V2ArmCmdSimulator：
#   臂目标指令流（ArmScript 随机目标）照常写入 seg[1:7]，但
#   arm_override=False —— act[15:21] 完全归策略，跟随压力由
#   r_arm_r / r_arm_l 奖励通道表达（"可忽略指令"语义同步令）。
# 指令段 obs[57:79] = flag|arm_tgt|waist_tgt(0)|step_cur|step_next。
# 奖励通道见 experiments_ppo/exp_v2_s4_armcmd.py：
#   r_potential·3 + r_fall·2 + r_step_foot/mv/st/yaw（到期稀疏）
#   + r_arm_r / r_arm_l（逐帧 -w·err 稠密）。
# 扰动：StandingTriggeredForcePlugin 复用 S2/S3 配置——推力参数由
#   episode_options["impulse_params"] 供给；本实验固定 40N 档最高级
#   （duration 31-40 帧），见 exp_v2_s4_armcmd.py LEVEL_* 覆盖。

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25          # 与 simulator.steps_per_action 一致
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.v1.v2_armcmd_simulator:V2ArmCmdSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    arm_script: true
    arm_override: false             # ← D17：臂令只进观测，不覆写动作
    arm_hold_range: [2, 20]
    arm_tgt_range: [-1.0, 1.0]
    flag_height: 1.10
    flag_grace: 5
    flag_settle: 20
    # —— 步令系统（D16 时限预算） ——
    step_enabled: true
    steps_per_action: 25            # 必须与上面 runtime 一致
    budget_min_s: 0.15              # 不动令时限 (20Hz→3帧)
    budget_max_s: 0.50              # 满行程令时限 (20Hz→10帧)
    budget_travel_m: 0.53           # 满行程标称距离 (2×STAGGER_UNIT)
    foot_tol: 0.10                  # 到位判定阈值 m
    wall_margin: 0.30

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.end2end.standing_triggered_force:StandingTriggeredForcePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      standing_height_threshold: 1.10
      standing_grace_steps: 5
      standing_settle_steps: 20
      random_delay_max_steps: 10
      observe_steps: 20
      impulse_body: "torso"
      force_threshold: 1.0

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  step_report_a:
    cls: "baseline.humanoid21.v1.step_report_observer:StepReportObserver"
    config:
      agent_id: "robot_a"
  step_report_b:
    cls: "baseline.humanoid21.v1.step_report_observer:StepReportObserver"
    config:
      agent_id: "robot_b"
  arm_follow_a:
    cls: "baseline.humanoid21.v1.arm_follow_observer:ArmFollowObserver"
    config:
      agent_id: "robot_a"
  arm_follow_b:
    cls: "baseline.humanoid21.v1.arm_follow_observer:ArmFollowObserver"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
