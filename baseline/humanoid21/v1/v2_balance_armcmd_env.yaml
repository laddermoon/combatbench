# V2 线臂令跟随分支 — 平衡 + 臂令（D17，S3 血统，79 维）。
#
# = v2_balance_arm_env.yaml 全套（推力插件 + 倒地起点 + 全部观测/
# 奖励）+ V2ArmCmdSimulator：
#   arm_tgt 指令流照常生成/写入 seg[1:7]（flag|arm_tgt 布局不变），
#   但 arm_override=False —— act[15:21] 完全归策略，跟随压力由
#   r_arm_r / r_arm_l 奖励通道表达（"可忽略指令"语义）。
#   步令系统 step_enabled=False（本分支不背 S4 步令任务）。
# 扰动：StandingTriggeredForcePlugin 同 S3；推力参数由
#   episode_options["impulse_params"] 供给——本实验固定 40N 档
#   最高级（40N × 31-40 帧），见 exp_v2_s3_armcmd.py LEVEL_* 覆盖。
#
# 奖励通道组装见 experiments_ppo/exp_v2_s3_armcmd.py：
#   r_potential·3 + r_fall·2 + r_cross·φ² + r_arm_r/l（逐帧 -w·err）。

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.v1.v2_armcmd_simulator:V2ArmCmdSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    arm_script: true
    arm_hold_range: [2, 20]
    arm_tgt_range: [-1.0, 1.0]
    arm_release_prob: 0.25         # 每臂切换时 25% 概率本周期不劫持（tgt=0 标记，err 不计分）
    flag_height: 1.10
    flag_grace: 5
    flag_settle: 20
    step_enabled: false            # D17：本分支无 S4 步令任务

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.end2end.standing_triggered_force:StandingTriggeredForcePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      standing_height_threshold: 1.10
      standing_grace_steps: 5
      standing_settle_steps: 20
      random_delay_max_steps: 10
      observe_steps: 20
      impulse_body: "torso"
      force_threshold: 1.0

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
  arm_follow_a:
    cls: "baseline.humanoid21.v1.arm_follow_observer:ArmFollowObserver"
    config:
      agent_id: "robot_a"
  arm_follow_b:
    cls: "baseline.humanoid21.v1.arm_follow_observer:ArmFollowObserver"
    config:
      agent_id: "robot_b"
