# STEPBUDGET+ARM-HARD — 方向+预算步令 × 双臂独立硬劫持（STEPBUDGET_V1_PLAN.md）：79 维。
# 由 v2_stepcmd_env 克隆：sim 换 V2StepBudgetSimulator，observer 换
# stepbudget_report。步令段 = [foot, ux, uy, Δψ, budget/20, 0]。
# 以下为原 stepcmd 注释（底座部分仍适用）：
#
# = S2 底座（standing 起点 + 倒地起点插件 + 无臂脚本，双臂自控）
#   换任务核心：V2StepCmdSimulator 0.5s 周期连续指令流，
#   D20 残差编码逐帧写入 obs[67:79]，无站立门控（帧0施令）。
#   移除推力插件（V1 无扰动）与 s42i 模仿观测（反迈步）。
# 指令段 obs[57:79] = flag(0)|arm_tgt(0)|waist(0)|step_cur|step_next，
#   step_* = [foot, Δx, Δy, Δψ, 0, 0]（残差=动脚踝→世界锚目标，
#   本体系；保持令 foot=0、Δψ=对发令朝向漂移）。
# 奖励通道见 experiments_ppo/exp_v2_stepcmd.py：
#   r_potential(h_cap)·3 + r_fall·2 + r_step_mv/st/yaw（逐帧积分）。

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25          # 与 simulator.steps_per_action 一致
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.v1.v2_stepbudhard_simulator:V2StepBudgetArmHardSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    arm_script: false
    # —— STEPBUDGET 步令系统（方向+预算，Clip 组合） ——
    step_enabled: true
    steps_per_action: 25            # 必须与上面 runtime 一致
    p_random: 0.2                   # 逐步纯随机替换概率（Clip 外 20%）
    wall_margin: 0.30
    # —— 双臂独立硬劫持（ARMDUAL 调度分布 + 覆写执行器 + 站立门控） ——
    arm_hold_range: [2, 20]         # 周期时长 U(2,20) 帧
    arm_tgt_range: [-1.0, 1.0]      # 关节目标 U(-1,1)
    dual_prob: 0.1                  # 双臂同劫概率（否则单臂 50/50）
    flag_height: 1.10               # 站立门控：h>此值持续 flag_settle 帧→劫
    flag_grace: 5                   #   低于阈值宽限帧数→清
    flag_settle: 20                 #   置位所需持续帧数

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
      h_cap: 1.10                    # 高度饱和：≥1.1m 不再奖励站高
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
      h_cap: 1.10
  stepbudget_report_a:
    cls: "baseline.humanoid21.v1.stepbudget_report_observer:StepBudgetReportObserver"
    config:
      agent_id: "robot_a"
  stepbudget_report_b:
    cls: "baseline.humanoid21.v1.stepbudget_report_observer:StepBudgetReportObserver"
    config:
      agent_id: "robot_b"
  arm_dual_a:
    cls: "baseline.humanoid21.v1.arm_dual_observer:ArmDualObserver"
    config:
      agent_id: "robot_a"
  arm_dual_b:
    cls: "baseline.humanoid21.v1.arm_dual_observer:ArmDualObserver"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
