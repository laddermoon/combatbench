# V2 线 Stage 3 — 随机臂脚本接管下的推力平衡课程（79 维）。
#
# = v2_balance_env.yaml 全套（12 级推力课程 + 倒地起点 + 全部观测/
# 奖励）+ V2Simulator(arm_script=True)：
#   站稳后（h>1.10 持续 20 步，grace 5——与推力判据同源）flag=1，
#   env 内把 act[15:21] 覆写为随机脚本目标（每臂独立 U(2,20) 步
#   重采样、U(-1,1) norm 目标、双臂/双机独立 rng）；未站稳/摔倒
#   （flag=0）期间策略自控双臂（起身/重站稳可用臂）。
# 指令段 obs[57:64]=flag|arm_tgt——obs 承诺=实际施加（同源契约）。
#
# 奖励通道组装见 experiments_ppo/exp_v2_s3_balance_arm.py（与
# v2_s2_balance 相同：r_potential·3 + r_fall·2 + r_std_clip·2φ²·非受推）。

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.v1.v2_simulator:V2Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    arm_script: true
    arm_hold_range: [2, 20]
    arm_tgt_range: [-1.0, 1.0]
    flag_height: 1.10
    flag_grace: 5
    flag_settle: 20

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.end2end.standing_triggered_force:StandingTriggeredForcePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      standing_height_threshold: 1.10
      standing_grace_steps: 5
      standing_settle_steps: 20
      random_delay_max_steps: 10
      observe_steps: 20
      impulse_body: "torso"
      force_threshold: 1.0

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
