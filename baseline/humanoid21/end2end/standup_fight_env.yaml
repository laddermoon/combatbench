# End-to-end step 5: standup + follow + face + fight.
#
# Based on standup_face_env.yaml:
#   - Removes RandomMovePlugin (opponent is now a real policy from pool)
#   - Adds CombatScoringPlugin (damage tracking, KO detection)
#   - Adds DamageBreakdownRewarder (per-step dealt/taken for learning agent)
#
# The learning agent starts from random fallen state, stands up, approaches
# the opponent, faces it, and fights.  The opponent is a policy sampled from
# the opponent pool (assigned at rollout job construction time).
#
# Reward channels (in experiment):
#   r_potential     = 0.01 × φ_4stage,           aw = 3.0 (STANDUP only)
#   r_fall          = 0.01 × φ_height,           aw = 3.0 (BALANCE only)
#   r_left_foot     = clip(h_left, -0.05, 0.05),  aw = state machine (BALANCE only)
#   r_right_foot    = clip(h_right, -0.05, 0.05), aw = state machine (BALANCE only)
#   r_radial        = radial approach vel,        aw = 3.0 × φ_height² × BALANCE
#   r_tangential    = tangential penalty,         aw = 1.0 × φ_height² × BALANCE
#   r_face          = facing_score × dist_gate,   aw = 1.0 × φ_height² × BALANCE
#   r_damage_dealt  = damage dealt to opponent,   aw = dealt_weight × dist_gate × BALANCE
#   r_damage_taken  = damage taken from opponent, aw = taken_weight × dist_gate × BALANCE
#   (dist_gate: hard switch, 1.0 when dist ≤ 0.9 m, 0 otherwise)

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps (standup ~100 + approach/fight ~500)."
  agent_id:
    default: "robot_a"
    description: "The learning robot."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["${agent_id}"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "envs.humanoid21.plugins:CombatScoringPlugin"
    config:
      initial_health: 100.0
      initial_health_a: 100.0
      initial_health_b: 100.0
      force_scale: 100.0
      request_termination_on_ko: true

observer_plugins:
  standing_balance:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: ${agent_id}
  height_phi:
    cls: "baseline.humanoid21.plugins.height_phi_observer:HeightPhiObserver"
    config:
      agent_id: ${agent_id}
  foot_state:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: ${agent_id}
  approach_velocity:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: ${agent_id}
  face_opponent:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: ${agent_id}
  damage_breakdown:
    cls: "baseline.humanoid21.fight.damage:DamageBreakdownRewarder"
    config:
      agent_id: ${agent_id}
