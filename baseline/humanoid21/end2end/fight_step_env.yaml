# Fight stage A (new recipe): attack_prep_step env where the scripted
# kinematic target is replaced by a real policy-driven opponent.
#
# Differences vs attack_prep_step_env.yaml:
#   - RandomMovePlugin REMOVED — robot on the non-learner side is
#     driven by a frozen policy blueprint (see Job.policy_a/b_bp).
#   - StandingTriggeredForcePlugin REMOVED — external push training is
#     done; in the fight stage the opponent's strikes are the
#     disturbance.  (push_state_* observers kept: they degrade to
#     neutral output without the plugin, so channel wiring is
#     unchanged.)
#   - CombatScoringPlugin ADDED — per-substep hit detection, HP ledger,
#     KO terminates the whole episode.
#   - DamageBreakdownRewarder ADDED (both sides) — per-step
#     {"dealt","taken"} deltas for the learner's damage channels.
#
# The learner still starts from random fallen states
# (RandomFallenStatePlugin targets ${agent_id}); the frozen opponent
# starts standing — its inherited skills are stand/follow/punch, so it
# walks over and pressures the learner's standup.  That asymmetry is
# intentional for fight_a: recover-under-pressure is the first combat
# skill.  Both robots at initial_health HP; first to 0 ends the round
# (KO -> request_termination with agent_id=None -> all agents).
#
# Reward channels = attack_prep recipe + r_damage_dealt /
# r_damage_taken (weights applied trainer-side in exp_fight_step.py).

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps per round (KO may end it earlier)."
  agent_id:
    default: "robot_a"
    description: "The learning robot."
  initial_health:
    default: 100.0
    description: "HP per robot; KO when a robot reaches 0."
  force_scale:
    default: 100.0
    description: "CombatScoringPlugin force normalization (N)."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  # GaitClockSimulator appends 3 dims to obs (indices 96..98):
  # cmd_L / cmd_R / window-progress — the stepping command the policy
  # can see (aligned with clock_foot_weights on the reward side).
  cls: "baseline.humanoid21.end2end.gait_clock_simulator:GaitClockSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    gait_period: 40

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["${agent_id}"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "envs.humanoid21.plugins:CombatScoringPlugin"
    config:
      initial_health: ${initial_health}
      force_scale: ${force_scale}
      request_termination_on_ko: true

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  # Non-foot body contact with arena walls — the wall-lean exploit.
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  # Push state machine per frame — neutral output without the force
  # plugin; kept so the channel wiring matches attack_prep exactly.
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
  # Follow: per-frame XY positions of self and opponent.
  approach_velocity_a:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: "robot_a"
  approach_velocity_b:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: "robot_b"
  # Face: torso forward unit vector (XY projection).
  face_opponent_a:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: "robot_a"
  face_opponent_b:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: "robot_b"

  # Arm state for punch shaping: elbow norms + hand/head/shoulder dists.
  arm_state_a:
    cls: "baseline.humanoid21.end2end.arm_state_observer:ArmStateObserver"
    config:
      agent_id: "robot_a"
  arm_state_b:
    cls: "baseline.humanoid21.end2end.arm_state_observer:ArmStateObserver"
    config:
      agent_id: "robot_b"

  # Per-step damage deltas driven by CombatScoringPlugin's HP ledger.
  damage_breakdown_a:
    cls: "baseline.humanoid21.rewards.damage:DamageBreakdownRewarder"
    config:
      agent_id: "robot_a"
  damage_breakdown_b:
    cls: "baseline.humanoid21.rewards.damage:DamageBreakdownRewarder"
    config:
      agent_id: "robot_b"
