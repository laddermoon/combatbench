# Attack-prep: follow_v2 (standup + balance + stepping + follow + face)
#                + arm punch shaping.
#
# Identical to follow_v2_env.yaml with one addition: ArmStateObserver, which
# exposes elbow angles and hand/head/shoulder distances so the experiment can
# run the arm punch state machine.
#
# Single learning agent starts from random fallen state, stands up, maintains
# balance with per-foot stepping, follows the scripted moving target (fixed
# speed), faces it when within 1.5 m, and practices alternating punches when
# within striking range.
#
# Observer sets:
#   - StandingBalance4StageRewarder: 4-stage φ for standup phase (r_potential)
#   - HeightPhiObserver: height-based φ for balance phase (r_fall) + φ² gating
#   - FootStateObserver: per-foot height + contact for stepping
#   - ApproachVelocityRewarder: radial/tangential velocity for following
#   - FaceOpponentObserver: forward axis for facing opponent
#   - ArmStateObserver: elbow angles + hand/head/shoulder distances (NEW)
#
# Reward channels (in experiment):
#   r_potential       = 0.01 × φ_4stage,           aw = 3.0 (STANDUP only)
#   r_fall            = 0.01 × φ_height,           aw = 3.0 (BALANCE only)
#   r_left_foot       = clip(h_left, ±0.05),       aw = stepping machine (BALANCE)
#   r_right_foot      = clip(h_right, ±0.05),      aw = stepping machine (BALANCE)
#   r_radial          = radial approach vel,       aw = 3.0 × out_zone × φ_h² × BALANCE
#   r_tangential      = tangential penalty,        aw = 1.0 × out_zone × φ_h² × BALANCE
#   r_face            = facing_score,              aw = 1.0 × dist_gate × φ_h² × BALANCE
#   r_left_elbow      = (1 - left_elbow_norm)/2,   aw = arm machine × φ_h² × BALANCE
#   r_right_elbow     = (1 - right_elbow_norm)/2,  aw = arm machine × φ_h² × BALANCE
#   r_left_hand_dist  = left hand → opp head (m),  aw = arm machine × φ_h² × BALANCE
#   r_right_hand_dist = right hand → opp head (m), aw = arm machine × φ_h² × BALANCE
#
# The arm state machine only runs on valid segments:
#   dist <= 1.1 m AND facing within ±60° of the opponent.
#
# No imbalance termination — robot can fall and get back up.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps (standup ~100 + balance/follow/punch ~500)."
  agent_id:
    default: "robot_a"
    description: "The learning robot."
  oppo_agent_id:
    default: "robot_b"
    description: "The moving target robot (controlled by RandomMovePlugin)."
  random_move_speed:
    default: 0.5
    description: "Opponent movement speed (m/s).  Fixed — no curriculum."
  oppo_min_avoid_distance:
    default: 1.2
    description: "Minimum distance opponent keeps from learning robot."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["${agent_id}"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.plugins.random_move:RandomMovePlugin"
    config:
      target_robot: ${oppo_agent_id}
      speed: ${random_move_speed}
      min_avoid_distance: ${oppo_min_avoid_distance}

observer_plugins:
  standing_balance:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: ${agent_id}
  height_phi:
    cls: "baseline.humanoid21.plugins.height_phi_observer:HeightPhiObserver"
    config:
      agent_id: ${agent_id}
  foot_state:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: ${agent_id}
  approach_velocity:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: ${agent_id}
  face_opponent:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: ${agent_id}
  arm_state:
    cls: "baseline.humanoid21.end2end.arm_state_observer:ArmStateObserver"
    config:
      agent_id: ${agent_id}
