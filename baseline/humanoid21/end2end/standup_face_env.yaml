# End-to-end step 4: standup + follow + face opponent.
# Same as standup_follow_env.yaml but adds FaceOpponentObserver for r_face.
#
# The learning agent starts from random fallen state, stands up, follows
# the scripted moving target, and when within 1.5m must face the opponent.
#
# Reward channels (in experiment):
#   r_fall       = 0.01 × φ(t),           actor_weight = 3.0 (fixed)
#   r_cross      = cross-support signal,   actor_weight = 1.0 × φ²
#   r_radial     = radial approach vel,    actor_weight = 3.0 × φ²
#   r_tangential = tangential penalty,     actor_weight = 1.0 × φ²
#   r_face       = facing_score × dist_gate, actor_weight = 1.0 × φ²

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps (standup ~100 + follow/face ~500)."
  agent_id:
    default: "robot_a"
    description: "The learning robot."
  oppo_agent_id:
    default: "robot_b"
    description: "The moving target robot (controlled by RandomMovePlugin)."
  random_move_speed:
    default: 0.5
    description: "Opponent movement speed (m/s)."
  oppo_min_avoid_distance:
    default: 1.2
    description: "Minimum distance opponent keeps from learning robot."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["${agent_id}"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.plugins.random_move:RandomMovePlugin"
    config:
      target_robot: ${oppo_agent_id}
      speed: ${random_move_speed}
      min_avoid_distance: ${oppo_min_avoid_distance}

observer_plugins:
  standing_balance:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: ${agent_id}
  cross_support:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: ${agent_id}
  approach_velocity:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: ${agent_id}
  face_opponent:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: ${agent_id}
