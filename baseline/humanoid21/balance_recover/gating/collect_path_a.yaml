# Path A config: constant force impulse perturbation.
# Each episode: sample impulse params → apply force → policy controls robot → capture final state.

path: A
episodes: 100000

# Policy checkpoints × noise levels
# gen{N} policy paired with sample_weights_gen{N+1}.npz (that probe used gen{N} post-training)
policy_dirs:
  gen0: "baseline/runs/recovery_v5_gen0/policy"
  gen1: "baseline/runs/recovery_v5_gen1/policy"
  gen2: "baseline/runs/recovery_v5_gen2/policy"
  gen3: "baseline/runs/recovery_v5_gen3/policy"
  gen4: "baseline/runs/recovery_v5_gen4/policy"
  gen5: "baseline/runs/recovery_v5_gen5/policy"
  gen6: "baseline/runs/recovery_v5_gen6/policy"
  gen7: "baseline/runs/recovery_v5_gen7/policy"
  gen8: "baseline/runs/recovery_v5_gen8/policy"
policy_ids:
  gen0: 0
  gen1: 1
  gen2: 2
  gen3: 3
  gen4: 4
  gen5: 5
  gen6: 6
  gen7: 7
  gen8: 8
noise_sigmas: [0.0, 0.05, 0.1, 0.2]

# Environment
env_yaml: "baseline/humanoid21/balance_recover/gating/state_pool_impulse_env.yaml"

# Impulse sampling (per-generation boundary weights)
impulse_weights_dir: "baseline/humanoid21/balance_recover/run_recovery_v5"
impulse_body: "torso"

# Episode settings
initial_distance_range: [1.5, 3.0]
margin_steps: 0
episode_seed: 42

# RNG
seed: 12345
