# Path A: Constant force perturbation + policy-driven settling + episode-end capture.
# Impulse parameters are injected per-episode via episode_options["impulse_params"].
# The ConstantForcePlugin applies force in the real environment while the rollout
# policy controls the robot. Episode ends after max_steps and the final state is captured.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 10
    description: "Max action steps (= duration_action_steps + margin)."
  agent_id:
    default: "robot_a"
    description: "The robot we capture state from."
  impulse_body:
    default: "torso"
    description: "Default body to apply force on (overridden by episode_options)."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:DualImbalanceTerminationPlugin"
    config:
      force_threshold: 1.0
      tolerance: 1

  - cls: "envs.humanoid21.disturbance_plugins:ConstantForcePlugin"
    config:
      agent_id: ${agent_id}
      force: 100.0
      direction: 0.0
      duration_action_steps: 4
      body_name: ${impulse_body}

observer_plugins:
  episode_end_capture:
    cls: "envs.humanoid21.disturbance_plugins:EpisodeEndCaptureObserver"
    config:
      target_robot: ${agent_id}
  balance_analysis:
    cls: "envs.humanoid21.observer_plugins:Humanoid21BalanceAnalysisObserver"
    config:
      agent_id: ${agent_id}
