# Dual-agent balance environment with impulse perturbation + HeightPhiObserver per agent.
# Same as basic_balance_v2_phi_dual_env.yaml but adds ImpulsePerturbationPlugin for
# both robots, generating physically realistic perturbed initial states via internal sim.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps."
  policy_blueprint_path:
    default: null
    description: >-
      Path to policy_blueprint.yaml for the internal sim. The policy
      controls the robot during impulse application so that the perturbed
      state is physically realistic.
  impulse_body:
    default: "torso"
    description: "Body to apply impulse force on."
  force_magnitude:
    default: [50, 150]
    description: "Force magnitude range (N). [min, max]."
  duration_action_steps:
    default: [2, 4]
    description: "Impulse duration range (action steps). [min, max]."
  direction_mode:
    default: "random_horizontal"
    description: "Direction sampling mode."
  fixed_direction:
    default: null
    description: "Fixed direction vector [x, y, z] when direction_mode='fixed'."
runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true
simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
plugins:
  - cls: "baseline.humanoid21.plugins.imbalance_termination:DualImbalanceTerminationPlugin"
    config:
      force_threshold: 1.0
      tolerance: 1

  - cls: "envs.humanoid21.disturbance_plugins:ImpulsePerturbationPlugin"
    config:
      target_robot: "robot_a"
      policy_blueprint_path: ${policy_blueprint_path}
      impulse_body: ${impulse_body}
      force_magnitude: ${force_magnitude}
      duration_action_steps: ${duration_action_steps}
      direction_mode: ${direction_mode}
      fixed_direction: ${fixed_direction}
      phy_steps_per_action: 25

  - cls: "envs.humanoid21.disturbance_plugins:ImpulsePerturbationPlugin"
    config:
      target_robot: "robot_b"
      policy_blueprint_path: ${policy_blueprint_path}
      impulse_body: ${impulse_body}
      force_magnitude: ${force_magnitude}
      duration_action_steps: ${duration_action_steps}
      direction_mode: ${direction_mode}
      fixed_direction: ${fixed_direction}
      phy_steps_per_action: 25
observer_plugins:
  cross_support_a:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_a"
  cross_support_b:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_b"
  posture_a:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: "robot_a"
  posture_b:
    cls: "baseline.humanoid21.rewards.posture_reward:PostureRewarder"
    config:
      agent_id: "robot_b"
  height_phi_a:
    cls: "baseline.humanoid21.plugins.height_phi_observer:HeightPhiObserver"
    config:
      agent_id: "robot_a"
  height_phi_b:
    cls: "baseline.humanoid21.plugins.height_phi_observer:HeightPhiObserver"
    config:
      agent_id: "robot_b"
