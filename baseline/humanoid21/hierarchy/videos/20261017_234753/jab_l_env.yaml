version: 1
runtime:
  phy_steps_per_action: 25
  max_steps: 35
  strict: true
simulator:
  cls: baseline.humanoid21.hierarchy.command_simulator:CommandSimulator
  config:
    cmd_version: v2
    initial_distance: 2.0
    debug_torque: false
    initial_pose_a: standing
    initial_pose_b: standing
    strike_dyn_target: false
    strike_phase_targets: true
plugins: []
observer_plugins:
  standing_balance_a:
    cls: baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder
    config:
      agent_id: robot_a
  standing_balance_b:
    cls: baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder
    config:
      agent_id: robot_b
  foot_state_a:
    cls: baseline.humanoid21.end2end.foot_state_observer:FootStateObserver
    config:
      agent_id: robot_a
  foot_state_b:
    cls: baseline.humanoid21.end2end.foot_state_observer:FootStateObserver
    config:
      agent_id: robot_b
  wall_contact_a:
    cls: baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver
    config:
      agent_id: robot_a
  wall_contact_b:
    cls: baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver
    config:
      agent_id: robot_b
  move_track_a:
    cls: baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver
    config:
      agent_id: robot_a
  move_track_b:
    cls: baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver
    config:
      agent_id: robot_b
  strike_track_a:
    cls: baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver
    config:
      agent_id: robot_a
  strike_track_b:
    cls: baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver
    config:
      agent_id: robot_b
