# Skill training — IDLE family env (66-dim).
#
# Step-in-place / standup skill: every episode starts from a random
# fallen state (RandomFallenStatePlugin writes the fallen pose into
# the env — same initial distribution as S2) and the command is the
# all-zero "in-place stepping" command for the whole episode.  The
# command covers both cases: fallen -> stand up -> step in place;
# standing -> keep stepping in place.
#
# Reward channels (in exp_skill_train_mbs.py):
#   r_potential / r_fall / r_hold / r_std_clip

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 80
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    cmd_version: "v2"
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    strike_dyn_target: false

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 5
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  move_track_a:
    cls: "baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver"
    config:
      agent_id: "robot_a"
  move_track_b:
    cls: "baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver"
    config:
      agent_id: "robot_b"
