# Skill training — STRIKE family env (66-dim).
#
# Extension-only strike skill episodes: WarmupSteppingPlugin mid-gait
# init, then one strike segment [0, k_land+margin] pointing at the clip
# landing point (single phase — no retract target).  The observer runs
# ext_only tracking: the reference clamps at the landing frame, so the
# margin frames score the held landing pose (faster = more time at
# target).  Everything after the window is unscored by construction.
#
# Reward channels (in exp_skill_train_mbs.py):
#   r_potential / r_fall / r_strike

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 40
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    cmd_version: "v2"
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    strike_dyn_target: false       # static landing-point target in obs

plugins:
  - cls: "baseline.humanoid21.plugins.warmup_stepping:WarmupSteppingPlugin"
    config:
      target_robots: "both"
      action_steps: 10
      phy_steps_per_action: 25
      body_dim: 57
      cmd_dim: 9
      sample_actions: true


observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  move_track_a:
    cls: "baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver"
    config:
      agent_id: "robot_a"
  move_track_b:
    cls: "baseline.humanoid21.hierarchy.move_track_observer:MoveTrackObserver"
    config:
      agent_id: "robot_b"
  strike_track_a:
    cls: "baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver"
    config:
      agent_id: "robot_a"
      ext_only: true
      # Heavy (lunge-stance) clips run the reference clock at half
      # rate: reaching k_land takes 12 frames instead of 6, giving the
      # robot physical time to form the staggered stance from stepping.
      clip_rates:
        cmu_144_20_m_seg01: 0.5
        cmu_144_20_seg01: 0.5
  strike_track_b:
    cls: "baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver"
    config:
      agent_id: "robot_b"
      ext_only: true
      clip_rates:
        cmu_144_20_m_seg01: 0.5
        cmu_144_20_seg01: 0.5
