# Strike-only keypoint two-phase env (66-dim) — for exp_strike_kp_2phase.
#
# Same simulator/observation contract as strike_2phase_env (CommandSimulator
# v2, 57 body + 9 cmd dims, strike_dyn_target replay); only the training
# observer differs: keypoint-position tracking replaces joint-angle MSE.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 30
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    cmd_version: "v2"
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    strike_dyn_target: true        # obs target replays ref hand path

plugins:
  - cls: "baseline.humanoid21.plugins.warmup_stepping:WarmupSteppingPlugin"
    config:
      target_robots: "both"
      action_steps: 0
      phy_steps_per_action: 25
      body_dim: 57
      cmd_dim: 9
      sample_actions: true


observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  kp_track_a:
    cls: "baseline.humanoid21.hierarchy.keypoint_track_observer:KeypointTrackObserver"
    config:
      agent_id: "robot_a"
  kp_track_b:
    cls: "baseline.humanoid21.hierarchy.keypoint_track_observer:KeypointTrackObserver"
    config:
      agent_id: "robot_b"
