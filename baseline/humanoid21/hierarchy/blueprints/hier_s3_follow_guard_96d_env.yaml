# Guard-96 Step 3 — follow & face an arc-wandering opponent, in guard.
#
# 96-dim AttackPrep stage 3 (bootstrip.md new-route chain).  Warm-start
# from the stage-2 guard-balance policy; the learner must hold the
# [0.6, 1.0] m distance band around an opponent driven by
# ArcMovePlugin: arc-length segmented headings (bounded curvature
# inside, arbitrary jumps between segments), time-segmented speed
# profile (1-3 s dwells, rate-limited ramps, v* ~ U[0,1] m/s), and a
# 50/50 face-learner vs fixed-yaw facing mode.  The opponent CAN
# approach the learner — no repulsion, only a 0.4 m contact clamp.
#
# Reward channels (in exp_hier_s3_follow_guard_96d.py):
#   r_potential = 0.01 × φ(t) × I(h_torso ≤ 1.24),  aw = 3.0
#   r_fall      = fall + wall-lean,                  aw = 2.0
#   r_cross     = alternation guidance,              aw = 1.0·φ²
#   r_band      = band-aware radial velocity,        aw = 3.0·out_band·φ²
#   r_tangential= lateral drift penalty,             aw = 1.0·out_band·φ²
#   r_face      = cos(forward, to_opp)⁺,             aw = 1.0·dist_gate·φ²
#   r_std_clip  = clip + pose + 0.5·cad + 0.5·h,
#                               aw = φ²·(1.0 out-band → 3.0 in-band)

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 600
    description: "Max action steps (standup ~100 + follow ~500)."
  agent_id:
    default: "robot_a"
    description: "The learning robot."
  oppo_agent_id:
    default: "robot_b"
    description: "The arc-moving target robot."
  arc_v_max:
    default: 1.0
    description: "Opponent speed ceiling (m/s) — curriculum-controlled."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["${agent_id}"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.end2end.standing_triggered_force:StandingTriggeredForcePlugin"
    config:
      target_robots: ["${agent_id}"]
      standing_height_threshold: 1.10
      standing_grace_steps: 5
      standing_settle_steps: 20
      random_delay_max_steps: 10
      observe_steps: 20
      impulse_body: "torso"
      force_threshold: 1.0
  - cls: "baseline.humanoid21.plugins.arc_move:ArcMovePlugin"
    config:
      target_robot: ${oppo_agent_id}
      v_max: ${arc_v_max}
      v_min: 0.0
      speed_seg_tmin: 1.0
      speed_seg_tmax: 3.0
      accel_max: 0.8
      seg_len_min: 0.5
      seg_len_max: 2.0
      kappa_max: 2.0
      face_learner_prob: 0.5
      boundary_margin: 0.4
      avoid_min: 0.4

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
      clip_path: "/data1/mono/things/combatbench/baseline/humanoid21/hierarchy/assets/jab_l_guard_clips.npz"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 8
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
      clip_path: "/data1/mono/things/combatbench/baseline/humanoid21/hierarchy/assets/jab_l_guard_clips.npz"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 8
  cross_support_a:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_a"
  cross_support_b:
    cls: "baseline.humanoid21.rewards.cross_support:CrossSupportBalanceRewarder"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
  approach_velocity_a:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: "robot_a"
  approach_velocity_b:
    cls: "baseline.humanoid21.rewards.follow_opponent:ApproachVelocityRewarder"
    config:
      agent_id: "robot_b"
  face_opponent_a:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: "robot_a"
  face_opponent_b:
    cls: "baseline.humanoid21.end2end.face_opponent:FaceOpponentObserver"
    config:
      agent_id: "robot_b"
