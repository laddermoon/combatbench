# Stand-punch skill env — 66-dim CommandSimulator (v2 cmd contract).
#
# Episode start: the plain arena reset pose (== stand_p5(), the
# planner's canonical standing pose; no state injection).
# StandPunchTargetPlugin resolves a pre-validated local-frame target
# into a world target + strike-hand guidance track; the simulator
# re-expresses the target in the instantaneous ego frame every step.
#
# Reward is computed offline by exp_stand_punch_mbs: per-episode
# stand-punch P5 plan + DeepMimic-style per-part tracking over the
# retimed clip (stand->coil->swing->land->strike, 0.65 s).

parameters:
  initial_distance:
    default: 2.0
  max_steps:
    default: 13
    description: "Thirteen 50-ms actions cover the 0.65-s stand punch; no unscored tail."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    initial_distance: ${initial_distance}
    cmd_version: "v2"
    debug_torque: false

plugins:
  - cls: "baseline.humanoid21.plugins.stand_punch_target:StandPunchTargetPlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
  - cls: "envs.framework.common_plugins:TimeoutPlugin"
    config:
      max_steps: ${max_steps}

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  point5_a:
    cls: "baseline.humanoid21.end2end.point5_observer:Point5Observer"
    config:
      agent_id: "robot_a"
  point5_b:
    cls: "baseline.humanoid21.end2end.point5_observer:Point5Observer"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
