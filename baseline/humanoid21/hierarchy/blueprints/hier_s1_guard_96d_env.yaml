# Guard-96 Step 1 — from-scratch standup -> jab_l dynamic guard hold.
#
# 96-dim port of hier_s1_guard_env.yaml for the new-route sub-skill
# chain (bootstrip.md: "Follow And AttackPrep", 96-dim raw input).
# Identical plugin/observer set; the only change is the simulator:
# bare Humanoid21Simulator (canonical 96-dim obs incl. opponent state)
# instead of the 66-dim CommandSimulator v2 contract — the upper-level
# router policy forwards the raw 96-dim obs to this skill verbatim.
#
# Clip library: assets/jab_l_guard_clips.npz — 7x40-frame feature windows
# built by extract_standard_clips.py --npz from a 100-step TrajectoryRecorder
# capture of the eval command (seed 997777).  The guard is *dynamic*:
# foot-load alternates with a ~16-step period -> cadence_lag=8.
#
# Reward channels (in exp_hier_s1_guard_96d.py):
#   r_potential = 0.01 × φ(t) × I(h_torso <= 1.24),   aw = 1.0 (fixed)
#   r_std_clip  = clip + pose + 0.5·cad + 0.5·h,      aw = φ(t)^2

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 200
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "envs.humanoid21.simulator:Humanoid21Simulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
      clip_path: "/data1/mono/things/combatbench/baseline/humanoid21/hierarchy/assets/jab_l_guard_clips.npz"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 8
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
      clip_path: "/data1/mono/things/combatbench/baseline/humanoid21/hierarchy/assets/jab_l_guard_clips.npz"
      sigma: 8.0
      sigma_pose: 0.9
      cadence_lag: 8
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
