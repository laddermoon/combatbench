# Hierarchy Step 2 — push recovery -> return to standard stepping (65-dim).
#
# Warm-start from the Step-1 final checkpoint.  CommandSimulator (65-dim
# obs = 57 proprio + 8-dim STAND cmd); both robots spawn from random
# fallen states, stand up, settle into cyclic stepping, then take
# curriculum-scheduled torso pushes (StandingTriggeredForcePlugin,
# 12 levels 40N -> 100N via the experiment).
#
# Reward channels (in exp_hier_s2_balance_mbs.py):
#   r_potential = 0.01 × φ(t),   aw = 3.0 (fixed)
#   r_fall      = fall + wall-lean + push-clean,  aw = 2.0 (fixed)
#   r_std_clip  = clip + 0.3·pose + 0.5·cad,     aw = φ² · (phase≠PUSHING)
#
# Clip reward is OFF while a push is being applied — the robot is free
# to break stance and take large recovery steps — and back ON during
# DELAY/OBSERVE so it re-settles into the standard stepping gait.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 400
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"

plugins:
  - cls: "envs.humanoid21.disturbance_plugins:RandomFallenStatePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      max_phy_steps: 1000
      height_threshold: 0.3
      reset_interval: 5
  - cls: "baseline.humanoid21.end2end.standing_triggered_force:StandingTriggeredForcePlugin"
    config:
      target_robots: ["robot_a", "robot_b"]
      standing_height_threshold: 1.15
      standing_settle_steps: 20
      random_delay_max_steps: 10
      observe_steps: 20
      impulse_body: "torso"
      force_threshold: 1.0

observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  standard_clip_a:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_a"
  standard_clip_b:
    cls: "baseline.humanoid21.hierarchy.standard_clip_observer:StandardClipObserver"
    config:
      agent_id: "robot_b"
  foot_state_a:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_a"
  foot_state_b:
    cls: "baseline.humanoid21.end2end.foot_state_observer:FootStateObserver"
    config:
      agent_id: "robot_b"
  wall_contact_a:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_a"
  wall_contact_b:
    cls: "baseline.humanoid21.end2end.wall_contact_observer:WallContactObserver"
    config:
      agent_id: "robot_b"
  push_state_a:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_a"
  push_state_b:
    cls: "baseline.humanoid21.end2end.push_state_observer:PushStateObserver"
    config:
      agent_id: "robot_b"
