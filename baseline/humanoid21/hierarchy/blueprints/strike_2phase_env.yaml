# Strike-only two-phase env (66-dim) — for exp_strike_2phase.
#
# Every episode is a single strike segment: WarmupSteppingPlugin
# random-skill init (0-20 steps), then one 30-step strike
# command.  Minimal observer set: standing_balance for the phi rails,
# strike_track (ext_only) for everything else — gate flag, phase
# potentials (r_p1_*/r_p2_*), and metrics.

parameters:
  initial_distance:
    default: 2.0
    description: "Spawn distance between robots (m)."
  max_steps:
    default: 30
    description: "Max action steps."

runtime:
  phy_steps_per_action: 25
  max_steps: ${max_steps}
  strict: true

simulator:
  cls: "baseline.humanoid21.hierarchy.command_simulator:CommandSimulator"
  config:
    cmd_version: "v2"
    initial_distance: ${initial_distance}
    debug_torque: false
    initial_pose_a: "standing"
    initial_pose_b: "standing"
    strike_dyn_target: true        # obs target replays ref hand path

plugins:
  - cls: "baseline.humanoid21.plugins.warmup_stepping:WarmupSteppingPlugin"
    config:
      target_robots: "both"
      action_steps: 0
      phy_steps_per_action: 25
      body_dim: 57
      cmd_dim: 9
      sample_actions: true


observer_plugins:
  standing_balance_a:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_a"
  standing_balance_b:
    cls: "baseline.humanoid21.rewards.standing_balance_4stage:StandingBalance4StageRewarder"
    config:
      agent_id: "robot_b"
  strike_track_a:
    cls: "baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver"
    config:
      agent_id: "robot_a"
      ext_only: true
      lookahead: 2
      rule_power_foot: true
  strike_track_b:
    cls: "baseline.humanoid21.hierarchy.strike_track_observer:StrikeTrackObserver"
    config:
      agent_id: "robot_b"
      ext_only: true
      lookahead: 2
      rule_power_foot: true
