<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>P5 Studio</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#ccc;
    font:12px/1.4 monospace}
  #view{position:absolute;inset:0}
  #side{position:absolute;top:0;right:0;width:230px;bottom:0;background:#1b1b1e;
    border-left:1px solid #333;padding:8px;overflow-y:auto}
  h3{margin:10px 0 4px;color:#8cf;font-size:12px}
  button{background:#2a2a30;color:#ccc;border:1px solid #444;padding:3px 8px;
    margin:2px;cursor:pointer;font:11px monospace}
  button:hover{background:#3a3a44}
  .kf{padding:3px 5px;border:1px solid #333;margin:2px 0;cursor:pointer}
  .kf.sel{border-color:#4af;background:#223}
  .file{padding:2px 4px;cursor:pointer;color:#9ce}
  .file:hover{background:#262630}
  #status{position:absolute;left:8px;bottom:8px;background:#0009;padding:5px 9px;
    border-radius:4px;white-space:pre}
  input{background:#222;color:#ccc;border:1px solid #444;width:70px;font:11px monospace}
  .dim{color:#777}
</style>
<script type="importmap">{"imports":{"three":"./static/three.module.js",
  "three/addons/controls/OrbitControls.js":"./static/OrbitControls.js"}}</script>
</head><body>
<div id="view"></div>
<div id="side">
  <h3>Clip 关键帧</h3>
  <div id="kflist"></div>
  <button id="badd">＋下一帧</button><button id="bcom">写入当前帧</button>
  <h3>文件 <span id="wdir" class="dim"></span></h3>
  <div id="flist"></div>
  <input id="fname" placeholder="name.json"><button id="bsave">存</button>
  <h3>选中帧 transfer</h3>
  <div id="trbox" class="dim">dx/dy/dyaw/dur 在帧列表内联编辑</div>
</div>
<div id="status">loading…</div>
<script type="module" src="./static/app.js"></script>
</body></html>
