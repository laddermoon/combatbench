<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#1a56db"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#137333"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#b06000"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#8430ce"/>
    </marker>
    <style>
      text { font-size: 13px; fill: #222; }
      .ln { font-size: 14px; font-weight: bold; }
      .fn { font-weight: bold; }
      .small { font-size: 11px; fill: #555; }
      .laneLbl { font-size: 15px; font-weight: bold; fill: #444;
                 writing-mode: tb; }
      .diff { font-size: 11px; font-weight: bold; }
      .easy { fill: #137333; }
      .mid { fill: #b06000; }
      .hard { fill: #c0392b; }
    </style>
  </defs>

  <!-- title -->
  <text x="530" y="26" text-anchor="middle" font-size="18" font-weight="bold">
    算法2 · 信息流分解（I = 信息项, F = 功能点）
  </text>

  <!-- input box -->
  <rect x="14" y="60" width="120" height="120" rx="10" fill="#f4f4f4" stroke="#999"/>
  <text x="74" y="84" text-anchor="middle" class="ln">输入</text>
  <text x="74" y="108" text-anchor="middle" class="small">Observation</text>
  <text x="74" y="128" text-anchor="middle" class="small">Clip</text>
  <text x="74" y="148" text-anchor="middle" class="small">Landmarks</text>

  <!-- ===== swimlane: P5 space ===== -->
  <rect x="150" y="46" width="900" height="150" rx="8" fill="#e8f0fe" opacity="0.55"/>
  <text x="158" y="66" class="laneLbl" fill="#1a56db">P5 空间</text>

  <!-- I1 -->
  <rect x="180" y="95" width="150" height="64" rx="9" fill="#fff" stroke="#1a56db" stroke-width="1.6"/>
  <text x="255" y="120" text-anchor="middle" class="fn" fill="#1a56db">I1 当前 P5</text>
  <text x="255" y="140" text-anchor="middle" class="small">obs 解码</text>

  <!-- F1 -->
  <rect x="370" y="62" width="150" height="56" rx="9" fill="#fff" stroke="#1a56db" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="445" y="84" text-anchor="middle" class="fn" fill="#1a56db">F1 锚点 P5 补全</text>
  <text x="445" y="102" text-anchor="middle" class="small">先验 + 后续姿态 P5</text>

  <!-- I2 -->
  <rect x="560" y="95" width="150" height="64" rx="9" fill="#fff" stroke="#1a56db" stroke-width="1.6"/>
  <text x="635" y="118" text-anchor="middle" class="fn" fill="#1a56db">I2 锚点 P5</text>
  <text x="635" y="136" text-anchor="middle" class="small">姿态锚点直接有</text>
  <text x="635" y="152" text-anchor="middle" class="small">接触锚点需 F1</text>

  <!-- I3 -->
  <rect x="790" y="95" width="210" height="64" rx="9" fill="#dbe7fd" stroke="#1a56db" stroke-width="2"/>
  <text x="895" y="120" text-anchor="middle" class="fn" fill="#1a56db">I3 下一帧目标 P5</text>
  <text x="895" y="140" text-anchor="middle" class="small">≠ 直线插值（摆动轨迹）</text>

  <!-- ===== swimlane: pose space ===== -->
  <rect x="150" y="212" width="900" height="120" rx="8" fill="#e6f4ea" opacity="0.55"/>
  <text x="158" y="232" class="laneLbl" fill="#137333">姿态空间</text>

  <!-- I4 -->
  <rect x="180" y="242" width="150" height="60" rx="9" fill="#fff" stroke="#137333" stroke-width="1.6"/>
  <text x="255" y="266" text-anchor="middle" class="fn" fill="#137333">I4 当前姿态</text>
  <text x="255" y="286" text-anchor="middle" class="small">obs[0:21]</text>

  <!-- F2 -->
  <rect x="560" y="242" width="150" height="60" rx="9" fill="#fff" stroke="#137333" stroke-width="1.6"/>
  <text x="635" y="265" text-anchor="middle" class="fn" fill="#137333">F2(I3,I4,I8)</text>
  <text x="635" y="284" text-anchor="middle" class="small">P5+质心→关节姿态</text>
  <text x="635" y="299" text-anchor="middle" class="diff easy">已解决=工具2</text>

  <!-- I5 -->
  <rect x="790" y="242" width="210" height="60" rx="9" fill="#d5ecd9" stroke="#137333" stroke-width="2"/>
  <text x="895" y="267" text-anchor="middle" class="fn" fill="#137333">I5 目标姿态 (21)</text>
  <text x="895" y="286" text-anchor="middle" class="small">pose_solver 输出</text>

  <!-- ===== swimlane: centroidal space ===== -->
  <rect x="150" y="348" width="900" height="120" rx="8" fill="#fef3e2" opacity="0.6"/>
  <text x="158" y="368" class="laneLbl" fill="#b06000">质心空间</text>

  <!-- I6 -->
  <rect x="180" y="378" width="150" height="60" rx="9" fill="#fff" stroke="#b06000" stroke-width="1.6"/>
  <text x="255" y="402" text-anchor="middle" class="fn" fill="#b06000">I6 当前质心态</text>
  <text x="255" y="422" text-anchor="middle" class="small">com + com_vel</text>

  <!-- I7 -->
  <rect x="370" y="378" width="150" height="60" rx="9" fill="#fff" stroke="#b06000" stroke-width="1.6"/>
  <text x="445" y="402" text-anchor="middle" class="fn" fill="#b06000">I7 锚点质心态</text>
  <text x="445" y="422" text-anchor="middle" class="small">lm.com / force_ratio</text>

  <!-- F3 -->
  <rect x="560" y="378" width="150" height="60" rx="9" fill="#fff" stroke="#b06000" stroke-width="1.6"/>
  <text x="635" y="400" text-anchor="middle" class="fn" fill="#b06000">F3(I6,I7)</text>
  <text x="635" y="418" text-anchor="middle" class="small">插值+capability 约束</text>
  <text x="635" y="433" text-anchor="middle" class="diff mid">中难（含到达时刻）</text>

  <!-- I8 -->
  <rect x="790" y="378" width="210" height="60" rx="9" fill="#fbe2bd" stroke="#b06000" stroke-width="2"/>
  <text x="895" y="402" text-anchor="middle" class="fn" fill="#b06000">I8 下一帧质心目标</text>
  <text x="895" y="422" text-anchor="middle" class="small">位置为主 · 速度=衍生</text>

  <!-- ===== swimlane: action space ===== -->
  <rect x="150" y="484" width="900" height="120" rx="8" fill="#f3e8fd" opacity="0.55"/>
  <text x="158" y="504" class="laneLbl" fill="#8430ce">动作空间</text>

  <!-- F4 -->
  <rect x="560" y="514" width="200" height="64" rx="9" fill="#fff" stroke="#8430ce" stroke-width="2"/>
  <text x="660" y="536" text-anchor="middle" class="fn" fill="#8430ce">F4(I8, I5 | I4, I6)</text>
  <text x="660" y="554" text-anchor="middle" class="small">反馈控制器 · 目标→动作</text>
  <text x="660" y="571" text-anchor="middle" class="diff hard">核心难点</text>

  <!-- R -->
  <rect x="830" y="514" width="170" height="64" rx="9" fill="#e3ccf5" stroke="#8430ce" stroke-width="2"/>
  <text x="915" y="540" text-anchor="middle" class="fn" fill="#8430ce">R = Action (21)</text>
  <text x="915" y="560" text-anchor="middle" class="small">归一化 PD 目标</text>

  <!-- ============ arrows ============ -->
  <!-- inputs -->
  <line x1="134" y1="100" x2="176" y2="120" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="134" y1="130" x2="252" y2="252" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="134" y1="160" x2="252" y2="392" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- clip/landmarks to I2/I7 -->
  <line x1="150" y1="80" x2="632" y2="92" stroke="#1a56db" stroke-width="1.4" marker-end="url(#arrB)"/>
  <line x1="150" y1="70" x2="442" y2="392" stroke="#b06000" stroke-width="1.4" marker-end="url(#arrO)"/>

  <!-- F1 -> I2 -->
  <line x1="445" y1="118" x2="560" y2="122" stroke="#1a56db" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrB)"/>
  <!-- I1 + I2 -> I3 -->
  <line x1="330" y1="120" x2="786" y2="120" stroke="#1a56db" stroke-width="1.8" marker-end="url(#arrB)"/>
  <line x1="710" y1="127" x2="786" y2="127" stroke="#1a56db" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- I6 + I7 -> F3 -> I8 -->
  <line x1="330" y1="408" x2="556" y2="408" stroke="#b06000" stroke-width="1.8" marker-end="url(#arrO)"/>
  <line x1="520" y1="408" x2="556" y2="408" stroke="#b06000" stroke-width="1.8" marker-end="url(#arrO)"/>
  <line x1="710" y1="408" x2="786" y2="408" stroke="#b06000" stroke-width="1.8" marker-end="url(#arrO)"/>

  <!-- I3,I4,I8 -> F2 -> I5 -->
  <line x1="895" y1="159" x2="700" y2="246" stroke="#137333" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="330" y1="268" x2="556" y2="270" stroke="#137333" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="895" y1="378" x2="700" y2="298" stroke="#b06000" stroke-width="1.6" marker-end="url(#arrO)"/>
  <line x1="710" y1="272" x2="786" y2="272" stroke="#137333" stroke-width="1.8" marker-end="url(#arrG)"/>

  <!-- I8,I5 -> F4 -> R -->
  <line x1="895" y1="302" x2="720" y2="520" stroke="#137333" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="895" y1="438" x2="745" y2="522" stroke="#b06000" stroke-width="1.8" marker-end="url(#arrO)"/>
  <line x1="760" y1="546" x2="826" y2="546" stroke="#8430ce" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- feedback: I4/I6 -> F4 (dashed red) -->
  <path d="M255 302 C 255 470, 400 500, 555 528" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <path d="M255 438 C 255 500, 400 540, 555 552" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="330" y="492" class="diff hard">反馈：当前姿态/质心（F4 必需输入）</text>

  <!-- order note -->
  <text x="160" y="626" class="small">顺序：先 F3 出 I8，再由 I8+I2 锚定 I3（保证姿态与质心一致）→ F2 → F4。缺：可行性检查（capability margin）、到达时刻决策。</text>
</svg>
