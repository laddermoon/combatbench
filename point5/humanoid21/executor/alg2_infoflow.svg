<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <style>
      text { font-size: 14px; fill: #222; }
      .fn { font-weight: bold; }
      .small { font-size: 11px; fill: #666; }
      .fLbl { font-size: 12px; font-weight: bold; fill: #555; }
      .fb  { font-size: 12px; font-weight: bold; fill: #c0392b; }
    </style>
  </defs>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold">
    算法2 · 信息流
  </text>

  <!-- ===== node column (cx=320, w=240 h=62) ===== -->
  <!-- y: 56,144,232,320,408,496,584,672,760,848,936,1024 -->

  <rect x="200" y="56"  width="240" height="62" rx="10" fill="#f4f4f4" stroke="#888"/>
  <text x="320" y="93"  text-anchor="middle" class="fn">Observation</text>

  <rect x="200" y="144" width="240" height="62" rx="10" fill="#f4f4f4" stroke="#888"/>
  <text x="320" y="181" text-anchor="middle" class="fn">Clip</text>

  <rect x="200" y="232" width="240" height="62" rx="10" fill="#f4f4f4" stroke="#888"/>
  <text x="320" y="269" text-anchor="middle" class="fn">Landmarks</text>

  <rect x="200" y="320" width="240" height="62" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.6"/>
  <text x="320" y="350" text-anchor="middle" class="fn" fill="#1a56db">I1 当前 P5</text>
  <text x="320" y="370" text-anchor="middle" class="small">obs 解码 / clip kf0</text>

  <rect x="200" y="408" width="240" height="62" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.6"/>
  <text x="320" y="438" text-anchor="middle" class="fn" fill="#1a56db">I2 锚点 P5</text>
  <text x="320" y="458" text-anchor="middle" class="small">姿态锚点直接有</text>

  <rect x="200" y="496" width="240" height="62" rx="10" fill="#dbe7fd" stroke="#1a56db" stroke-width="2"/>
  <text x="320" y="526" text-anchor="middle" class="fn" fill="#1a56db">I3 下一帧目标 P5</text>
  <text x="320" y="546" text-anchor="middle" class="small">F2</text>

  <rect x="200" y="584" width="240" height="62" rx="10" fill="#e6f4ea" stroke="#137333" stroke-width="1.6"/>
  <text x="320" y="614" text-anchor="middle" class="fn" fill="#137333">I4 当前姿态</text>
  <text x="320" y="634" text-anchor="middle" class="small">obs[0:21]</text>

  <rect x="200" y="672" width="240" height="62" rx="10" fill="#d5ecd9" stroke="#137333" stroke-width="2"/>
  <text x="320" y="702" text-anchor="middle" class="fn" fill="#137333">I5 目标姿态 (21)</text>
  <text x="320" y="722" text-anchor="middle" class="small">F3</text>

  <rect x="200" y="760" width="240" height="62" rx="10" fill="#fef3e2" stroke="#b06000" stroke-width="1.6"/>
  <text x="320" y="790" text-anchor="middle" class="fn" fill="#b06000">I6 当前质心态</text>
  <text x="320" y="810" text-anchor="middle" class="small">com + com_vel</text>

  <rect x="200" y="848" width="240" height="62" rx="10" fill="#fef3e2" stroke="#b06000" stroke-width="1.6"/>
  <text x="320" y="878" text-anchor="middle" class="fn" fill="#b06000">I7 锚点质心态</text>
  <text x="320" y="898" text-anchor="middle" class="small">lm.com / force_ratio</text>

  <rect x="200" y="936" width="240" height="62" rx="10" fill="#fbe2bd" stroke="#b06000" stroke-width="2"/>
  <text x="320" y="966" text-anchor="middle" class="fn" fill="#b06000">I8 下一帧质心目标</text>
  <text x="320" y="986" text-anchor="middle" class="small">F4 · 速度=衍生</text>

  <rect x="200" y="1024" width="240" height="62" rx="10" fill="#e3ccf5" stroke="#8430ce" stroke-width="2"/>
  <text x="320" y="1054" text-anchor="middle" class="fn" fill="#8430ce">R = Action (21)</text>
  <text x="320" y="1074" text-anchor="middle" class="small">F5</text>

  <!-- ===== right-side forward arcs ===== -->
  <!-- Observation -> I1 -->
  <path d="M440 100 C 560 110, 560 340, 442 348" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Observation -> I4 -->
  <path d="M440 108 C 610 180, 610 560, 442 610" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Observation -> I6 -->
  <path d="M440 116 C 640 260, 640 740, 442 786" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Clip -> I1 (short) -->
  <path d="M440 175 C 510 210, 510 320, 442 342" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- Landmarks -> I2 -->
  <path d="M440 263 C 530 300, 530 390, 442 434" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <!-- Landmarks -> I7 -->
  <path d="M440 275 C 580 400, 580 800, 442 874" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- I1 -> I3 -->
  <path d="M440 351 C 540 390, 540 480, 442 522" fill="none" stroke="#1a56db" stroke-width="1.7" marker-end="url(#arr)"/>
  <!-- I2 -> I3 -->
  <path d="M440 439 C 500 460, 500 500, 442 524" fill="none" stroke="#1a56db" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="510" y="470" class="fLbl">F2</text>

  <!-- I3 -> I5 -->
  <path d="M440 540 C 520 570, 520 660, 442 698" fill="none" stroke="#137333" stroke-width="1.7" marker-end="url(#arr)"/>
  <!-- I4 -> I5 (adjacent) -->
  <path d="M440 615 C 480 640, 480 660, 442 700" fill="none" stroke="#137333" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="490" y="650" class="fLbl">F3</text>
  <!-- I8 -> I5 (long arc, dashed=optional) -->
  <path d="M440 955 C 560 920, 580 750, 442 706" fill="none" stroke="#b06000" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <!-- I6 -> I8 -->
  <path d="M440 800 C 520 830, 520 920, 442 962" fill="none" stroke="#b06000" stroke-width="1.7" marker-end="url(#arr)"/>
  <!-- I7 -> I8 (adjacent) -->
  <path d="M440 879 C 480 900, 480 930, 442 964" fill="none" stroke="#b06000" stroke-width="1.7" marker-end="url(#arr)"/>
  <text x="490" y="880" class="fLbl">F4</text>

  <!-- I8 -> R -->
  <path d="M440 967 C 500 985, 500 1010, 442 1050" fill="none" stroke="#b06000" stroke-width="1.7" marker-end="url(#arr)"/>
  <!-- I5 -> R -->
  <path d="M440 720 C 560 780, 580 960, 442 1044" fill="none" stroke="#8430ce" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="560" y="950" class="fLbl">F5</text>

  <!-- ===== left-side feedback arcs (red dashed) ===== -->
  <!-- I4 -> R -->
  <path d="M200 615 C 60 700, 60 1000, 198 1050" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <!-- I6 -> R -->
  <path d="M200 800 C 90 880, 90 1020, 198 1058" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="52" y="930" class="fb">反</text>
  <text x="52" y="946" class="fb">馈</text>
</svg>
