<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 z" fill="#c0392b"/>
    </marker>
    <style>
      text { font-size: 13px; fill: #222; }
      .fn { font-weight: bold; }
      .small { font-size: 11px; fill: #555; }
      .laneLbl { font-size: 15px; font-weight: bold; }
      .fLbl { font-size: 11px; font-weight: bold; fill: #666; }
    </style>
  </defs>

  <text x="530" y="26" text-anchor="middle" font-size="18" font-weight="bold">
    算法2 · 信息流（边 = 功能点 F）
  </text>

  <!-- inputs -->
  <rect x="16" y="70" width="120" height="52" rx="9" fill="#f4f4f4" stroke="#999"/>
  <text x="76" y="101" text-anchor="middle" class="fn">Observation</text>
  <rect x="16" y="140" width="120" height="46" rx="9" fill="#f4f4f4" stroke="#999"/>
  <text x="76" y="169" text-anchor="middle" class="fn">Clip</text>
  <rect x="16" y="204" width="120" height="46" rx="9" fill="#f4f4f4" stroke="#999"/>
  <text x="76" y="233" text-anchor="middle" class="fn">Landmarks</text>

  <!-- ===== P5 space ===== -->
  <rect x="160" y="46" width="890" height="150" rx="8" fill="#e8f0fe" opacity="0.55"/>
  <text x="168" y="68" class="laneLbl" fill="#1a56db">P5 空间</text>

  <rect x="190" y="95" width="160" height="64" rx="9" fill="#fff" stroke="#1a56db" stroke-width="1.6"/>
  <text x="270" y="120" text-anchor="middle" class="fn" fill="#1a56db">I1 当前 P5</text>
  <text x="270" y="140" text-anchor="middle" class="small">obs 解码 / clip kf0</text>

  <rect x="450" y="95" width="160" height="64" rx="9" fill="#fff" stroke="#1a56db" stroke-width="1.6"/>
  <text x="530" y="118" text-anchor="middle" class="fn" fill="#1a56db">I2 锚点 P5</text>
  <text x="530" y="136" text-anchor="middle" class="small">姿态锚点直接有</text>
  <text x="530" y="152" text-anchor="middle" class="small">接触锚点需补全</text>

  <rect x="760" y="95" width="220" height="64" rx="9" fill="#dbe7fd" stroke="#1a56db" stroke-width="2"/>
  <text x="870" y="122" text-anchor="middle" class="fn" fill="#1a56db">I3 下一帧目标 P5</text>
  <text x="870" y="142" text-anchor="middle" class="small">≠ 直线插值</text>

  <!-- ===== pose space ===== -->
  <rect x="160" y="212" width="890" height="120" rx="8" fill="#e6f4ea" opacity="0.55"/>
  <text x="168" y="234" class="laneLbl" fill="#137333">姿态空间</text>

  <rect x="190" y="242" width="160" height="60" rx="9" fill="#fff" stroke="#137333" stroke-width="1.6"/>
  <text x="270" y="266" text-anchor="middle" class="fn" fill="#137333">I4 当前姿态</text>
  <text x="270" y="286" text-anchor="middle" class="small">obs[0:21]</text>

  <rect x="760" y="242" width="220" height="60" rx="9" fill="#d5ecd9" stroke="#137333" stroke-width="2"/>
  <text x="870" y="267" text-anchor="middle" class="fn" fill="#137333">I5 目标姿态 (21)</text>
  <text x="870" y="286" text-anchor="middle" class="small">关节空间参考</text>

  <!-- ===== centroidal space ===== -->
  <rect x="160" y="348" width="890" height="120" rx="8" fill="#fef3e2" opacity="0.6"/>
  <text x="168" y="370" class="laneLbl" fill="#b06000">质心空间</text>

  <rect x="190" y="378" width="160" height="60" rx="9" fill="#fff" stroke="#b06000" stroke-width="1.6"/>
  <text x="270" y="402" text-anchor="middle" class="fn" fill="#b06000">I6 当前质心态</text>
  <text x="270" y="422" text-anchor="middle" class="small">com + com_vel</text>

  <rect x="450" y="378" width="160" height="60" rx="9" fill="#fff" stroke="#b06000" stroke-width="1.6"/>
  <text x="530" y="402" text-anchor="middle" class="fn" fill="#b06000">I7 锚点质心态</text>
  <text x="530" y="422" text-anchor="middle" class="small">lm.com / force_ratio</text>

  <rect x="760" y="378" width="220" height="60" rx="9" fill="#fbe2bd" stroke="#b06000" stroke-width="2"/>
  <text x="870" y="402" text-anchor="middle" class="fn" fill="#b06000">I8 下一帧质心目标</text>
  <text x="870" y="422" text-anchor="middle" class="small">位置为主 · 速度=衍生</text>

  <!-- ===== action space ===== -->
  <rect x="160" y="484" width="890" height="110" rx="8" fill="#f3e8fd" opacity="0.55"/>
  <text x="168" y="506" class="laneLbl" fill="#8430ce">动作空间</text>

  <rect x="760" y="514" width="220" height="64" rx="9" fill="#e3ccf5" stroke="#8430ce" stroke-width="2"/>
  <text x="870" y="541" text-anchor="middle" class="fn" fill="#8430ce">R = Action (21)</text>
  <text x="870" y="561" text-anchor="middle" class="small">归一化 PD 目标</text>

  <!-- ===== edges (F on the line) ===== -->
  <!-- Observation -> I1/I4/I6 -->
  <line x1="136" y1="96" x2="186" y2="118" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="106" x2="262" y2="248" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="116" x2="262" y2="388" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Clip -> I1 -->
  <line x1="136" y1="163" x2="255" y2="165" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <!-- Landmarks -> I2 (F1) , I7 -->
  <line x1="136" y1="227" x2="446" y2="118" stroke="#1a56db" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="160" class="fLbl">F1（接触锚点补全）</text>
  <line x1="136" y1="237" x2="446" y2="390" stroke="#b06000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- I1,I2,I8 -> I3 : F2 -->
  <line x1="350" y1="127" x2="756" y2="127" stroke="#1a56db" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="610" y1="127" x2="756" y2="127" stroke="#1a56db" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="885" y1="378" x2="880" y2="163" stroke="#1a56db" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="640" y="115" class="fLbl">F2</text>

  <!-- I6,I7 -> I8 : F4 -->
  <line x1="350" y1="408" x2="756" y2="408" stroke="#b06000" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="610" y1="408" x2="756" y2="408" stroke="#b06000" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="660" y="396" class="fLbl">F4</text>

  <!-- I3,I4,I8 -> I5 : F3 (I8 optional dashed) -->
  <line x1="870" y1="159" x2="870" y2="238" stroke="#137333" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="350" y1="270" x2="756" y2="270" stroke="#137333" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="760" y1="392" x2="790" y2="300" stroke="#b06000" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="560" y="258" class="fLbl">F3（I8 optional）</text>

  <!-- I8,I5 -> R : F5 -->
  <line x1="870" y1="302" x2="870" y2="510" stroke="#137333" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="920" y1="438" x2="892" y2="512" stroke="#b06000" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="930" y="480" class="fLbl">F5</text>

  <!-- feedback: I4,I6 -> R (dashed red) -->
  <path d="M270 302 C 270 500, 600 520, 756 540" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <path d="M270 438 C 270 540, 600 560, 756 556" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="420" y="528" class="fLbl" fill="#c0392b">反馈（当前姿态/质心）</text>
</svg>
