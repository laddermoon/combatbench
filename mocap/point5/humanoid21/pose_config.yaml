# Humanoid21 pose-completion configuration.
# ALL VALUES ARE NORMALIZED JOINT COORDS: q_norm = (q_rad - mid)/half_range,
# every joint spans [-1, 1] (project convention, same as action interface).
# Joint order = Humanoid21Meta.CONTROLLED_JOINTS (suffix stripped).

# Natural pose = spring zero (all joints at normalized 0). No config needed:
# the unloaded configuration IS the natural pose by definition.

# Joints excluded from optimization (none: ankles must stay free springs).
fixed_joints: []

# Stiffness design (validated by head-compression sweep, see POSE plan).
# Laws: quadratic F=-k*q|q| (progressive, soft mid-range) for absorbers;
#       linear    F=-k*q    (resists from start) for stiff/early-engage joints.
# Ratios matter (absolute scale is arbitrary); knee quadratic = 1.0 baseline.
stiffness_groups:
  torso:        {joints: [abdomen_z, abdomen_y, abdomen_x],
                 law: linear, k: {low: 20.0, high: 20.0}}
  legs:         {joints: [hip_x_right, hip_z_right, hip_y_right, knee_right,
                          hip_x_left, hip_z_left, hip_y_left, knee_left],
                 law: quadratic, k: {low: 1.0, high: 1.0}}
  ankles:       {joints: [ankle_y_right, ankle_x_right,
                          ankle_y_left, ankle_x_left],
                 law: quadratic, k: {low: 0.7, high: 0.7}}
  elbows:       {joints: [elbow_right, elbow_left],
                 # linear with same max force as knee -> engages torso early
                 law: linear, k: {low: 1.0, high: 1.0}}
  shoulders:    {joints: [shoulder1_right, shoulder2_right,
                          shoulder1_left, shoulder2_left],
                 law: linear, k: {low: 0.4, high: 0.4}}
