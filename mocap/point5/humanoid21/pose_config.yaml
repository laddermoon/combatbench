# Humanoid21 pose-completion configuration.
# ALL VALUES ARE NORMALIZED JOINT COORDS: q_norm = (q_rad - mid)/half_range,
# every joint spans [-1, 1] (project convention, same as action interface).
# Joint order = Humanoid21Meta.CONTROLLED_JOINTS (suffix stripped).

# Natural pose q0: visually relaxed stance (v9, user-confirmed).
natural_pose:
  abdomen_z: 0.0
  abdomen_y: 0.167      # (-0.25 rad)
  abdomen_x: 0.0
  hip_x_right: 0.0
  hip_z_right: 0.0
  hip_y_right: 0.586    # (-0.30 rad)
  knee_right: 0.607     # (-0.55 rad)
  ankle_y_right: 0.444  # (+0.40 rad, compensates knee flex -> foot flat)
  ankle_x_right: 0.0
  hip_x_left: 0.0
  hip_z_left: 0.0
  hip_y_left: 0.586
  knee_left: 0.607
  ankle_y_left: 0.444
  ankle_x_left: 0.0
  shoulder1_right: 0.76
  shoulder2_right: -0.04
  elbow_right: -0.385
  shoulder1_left: 0.76
  shoulder2_left: -0.04
  elbow_left: -0.385

# Joints excluded from optimization (none: ankles must stay free springs).
fixed_joints: []

# Spring stiffness per joint, normalized coords.
# Asymmetric: k = {low: below q0 side, high: above q0 side}.
# Scalar k expands to symmetric. Stiffer = less willing to deviate.
stiffness_groups:
  torso:        {joints: [abdomen_z, abdomen_y, abdomen_x],
                 k: {low: 3.0, high: 3.0}}
  hips:         {joints: [hip_x_right, hip_z_right, hip_y_right,
                          hip_x_left, hip_z_left, hip_y_left],
                 k: {low: 2.0, high: 2.0}}
  knees:        {joints: [knee_right, knee_left],
                 # below q0 = deeper flex (soft), above q0 = toward straight
                 # (stiff, resists losing the natural bend)
                 k: {low: 1.5, high: 3.0}}
  ankles:       {joints: [ankle_y_right, ankle_x_right,
                          ankle_y_left, ankle_x_left],
                 k: {low: 2.0, high: 2.0}}
  arms:         {joints: [shoulder1_right, shoulder2_right, elbow_right,
                          shoulder1_left, shoulder2_left, elbow_left],
                 k: {low: 1.0, high: 1.0}}
