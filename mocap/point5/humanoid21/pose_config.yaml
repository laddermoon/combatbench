# Humanoid21 pose-completion configuration (v1, pending user review)
# Joint order = Humanoid21Meta.CONTROLLED_JOINTS (suffix stripped).
# Values are raw qpos radians. Reset pose is all-zero (fully straight).

# Natural pose q^0: visually relaxed stance. Iterated with user via renders.
natural_pose:
  # v5: moderate torso lean + elbows forward of body + arms hang (user review)
  abdomen_z: 0.0
  abdomen_y: -0.25
  abdomen_x: 0.0
  hip_x_right: 0.0
  hip_z_right: 0.0
  hip_y_right: -0.30
  knee_right: -0.55
  ankle_y_right: 0.40
  ankle_x_right: 0.0
  hip_x_left: 0.0
  hip_z_left: 0.0
  hip_y_left: -0.30
  knee_left: -0.55
  ankle_y_left: 0.40
  ankle_x_left: 0.0
  shoulder1_right: 0.7
  shoulder2_right: -0.3
  elbow_right: -0.9
  shoulder1_left: 0.7
  shoulder2_left: -0.3
  elbow_left: -0.9

# Joints excluded from optimization (ankles: foot pose ignored by design).
fixed_joints:
  - ankle_y_right
  - ankle_x_right
  - ankle_y_left
  - ankle_x_left

# Stiffness groups k_j (spring-prior weights, normalized by joint scale).
stiffness_groups:
  torso:        {joints: [abdomen_z, abdomen_y, abdomen_x], k: 3.0}
  legs:         {joints: [hip_x_right, hip_z_right, hip_y_right, knee_right,
                          hip_x_left, hip_z_left, hip_y_left, knee_left],
                 k: 2.0}
  arms:         {joints: [shoulder1_right, shoulder2_right, elbow_right,
                          shoulder1_left, shoulder2_left, elbow_left],
                 k: 1.0}
